---
layout: default
title: Kontakt
---

<div class="contact-container">
    <h2>Kontakt</h2>
    
    <form id="contactForm">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" required placeholder="Dein Name">
        </div>
        <div class="form-group">
            <label for="email">E-Mail</label>
            <input type="email" id="email" required placeholder="deine@email.at">
        </div>
        <div class="form-group">
            <label for="message">Nachricht</label>
            <textarea id="message" rows="5" required placeholder="Deine Nachricht..."></textarea>
        </div>
        <button type="submit" id="submitBtn">Nachricht senden</button>
    </form>

    <div id="status" style="display: none; margin-top: 15px; padding: 10px; border-radius: 6px; font-weight: bold; text-align: center;"></div>
</div>

<script>
    document.getElementById('contactForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('status');
        
        const formData = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            message: document.getElementById('message').value
        };

        submitBtn.disabled = true;
        statusDiv.textContent = "Wird gesendet...";
        statusDiv.style.backgroundColor = "#e2e8f0";
        statusDiv.style.color = "#475569";
        statusDiv.style.display = "block";

        try {
            const response = await fetch('https://api.exemail.at/api/contact', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });

            const result = await response.json();

            if (response.ok && result.success) {
                statusDiv.textContent = "Nachricht erfolgreich gesendet!";
                statusDiv.style.backgroundColor = "#d4edda";
                statusDiv.style.color = "#155724";
                document.getElementById('contactForm').reset();
            } else {
                statusDiv.textContent = "Fehler: " + (result.error || "Unbekannter Fehler");
                statusDiv.style.backgroundColor = "#f8d7da";
                statusDiv.style.color = "#721c24";
            }
        } catch (error) {
            statusDiv.textContent = "Server aktuell nicht erreichbar.";
            statusDiv.style.backgroundColor = "#f8d7da";
            statusDiv.style.color = "#721c24";
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>
