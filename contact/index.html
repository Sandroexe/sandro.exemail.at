---
layout: default
title: Kontakt
---

<div class="contact-wrapper">
    <div class="contact-box">
        <h2 class="contact-title">Kontakt</h2>
        <p class="contact-subtitle">Schreib mir eine Nachricht – sie landet direkt auf meinem Smartphone.</p>
        
        <form id="contactForm">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" required placeholder="Dein Name">
            </div>
            <div class="form-group">
                <label for="email">E-Mail</label>
                <input type="email" id="email" required placeholder="deine@email.at">
            </div>
            <div class="form-group">
                <label for="message">Nachricht</label>
                <textarea id="message" rows="5" required placeholder="Deine Nachricht an mich..."></textarea>
            </div>
            <button type="submit" id="submitBtn">Nachricht senden</button>
        </form>

        <div id="status" class="status-msg"></div>
    </div>
</div>

<style>
    .contact-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
    }
    .contact-box {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        padding: 30px;
        border-radius: 12px;
        width: 100%;
        max-width: 500px;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }
    .contact-title {
        font-size: 1.8rem;
        margin-bottom: 5px;
        border-left: 4px solid #0056b3;
        padding-left: 10px;
        color: #fff;
    }
    .contact-subtitle {
        color: #888;
        font-size: 0.9rem;
        margin-bottom: 25px;
    }
    .form-group {
        display: flex;
        flex-direction: column; /* Bringt Label und Input untereinander */
        margin-bottom: 20px;
        text-align: left;
    }
    .form-group label {
        margin-bottom: 8px;
        color: #ccc;
        font-size: 0.9rem;
    }
    .form-group input, .form-group textarea {
        width: 100%;
        padding: 12px;
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 6px;
        color: #fff;
        font-size: 1rem;
        box-sizing: border-box;
    }
    .form-group input:focus, .form-group textarea:focus {
        outline: none;
        border-color: #0056b3;
    }
    #submitBtn {
        width: 100%;
        padding: 14px;
        background: #0056b3;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: bold;
    }
    #submitBtn:hover {
        background: #004085;
    }
    #submitBtn:disabled {
        background: #555;
        cursor: not-allowed;
    }
    .status-msg {
        margin-top: 20px;
        padding: 12px;
        border-radius: 6px;
        font-weight: bold;
        text-align: center;
        display: none;
    }
    .status-msg.loading {
        display: block;
        background: rgba(255, 255, 255, 0.1);
        color: #ccc;
    }
    .status-msg.success {
        display: block;
        background: rgba(40, 167, 69, 0.2);
        color: #28a745;
        border: 1px solid rgba(40, 167, 69, 0.4);
    }
    .status-msg.error {
        display: block;
        background: rgba(220, 53, 69, 0.2);
        color: #dc3545;
        border: 1px solid rgba(220, 53, 69, 0.4);
    }
</style>

<script>
    document.getElementById('contactForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('status');
        
        const formData = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            message: document.getElementById('message').value
        };

        submitBtn.disabled = true;
        statusDiv.textContent = "Wird gesendet...";
        statusDiv.className = "status-msg loading";

        try {
            const response = await fetch('https://api.exemail.at/api/contact', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });

            const result = await response.json();

            if (response.ok && result.success) {
                statusDiv.textContent = "Nachricht erfolgreich gesendet!";
                statusDiv.className = "status-msg success";
                document.getElementById('contactForm').reset();
            } else {
                statusDiv.textContent = "Fehler: " + (result.error || "Unbekannter Fehler");
                statusDiv.className = "status-msg error";
            }
        } catch (error) {
            statusDiv.textContent = "Server aktuell nicht erreichbar.";
            statusDiv.className = "status-msg error";
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>
