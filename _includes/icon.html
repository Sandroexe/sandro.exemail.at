{%- comment -%}
  Zeigt ein Icon aus assets/icons/ an.
  Aufruf:  {% include icon.html name="mail" %}
  Optional: klasse="icon--gross"
  Unbekannte Namen zeigen einfach nichts an (kein Fehler).
{%- endcomment -%}
<svg class="icon{% if include.klasse %} {{ include.klasse }}{% endif %}" aria-hidden="true" focusable="false"><use href="{{ '/assets/icons/sprite.svg' | relative_url }}#{{ include.name }}"></use></svg>
