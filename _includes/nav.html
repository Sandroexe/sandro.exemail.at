{%- comment -%} Zentrale Navigation · Quelle: _data/navigation.yml {%- endcomment -%}
{%- assign _cur = page.nav -%}
<nav class="fixed inset-x-0 top-0 z-50 h-16 border-b border-slate-200/80 bg-white/75 backdrop-blur-xl backdrop-saturate-150"
     aria-label="Hauptnavigation">
  <div class="mx-auto flex h-full max-w-6xl items-center justify-between px-5">
    <a href="/index.html" class="font-mono text-[15px] font-bold tracking-tight text-slate-900">
      sandro<span class="text-blue-600">.exe</span>
    </a>

    <button id="navToggle" type="button" aria-expanded="false" aria-controls="navMenu"
            aria-label="Menü / Menu"
            class="grid h-10 w-10 place-items-center rounded-xl border border-slate-200 bg-white text-slate-700 md:hidden">
      <i class="fa-solid fa-bars" aria-hidden="true"></i>
    </button>

    <div id="navMenu"
         class="hidden absolute inset-x-0 top-16 flex-col gap-1 border-b border-slate-200 bg-white/95 p-4 shadow-lg
                backdrop-blur-xl md:static md:flex md:flex-row md:items-center md:gap-1 md:border-0 md:bg-transparent md:p-0 md:shadow-none">
      {%- for item in site.data.navigation.primary -%}
      {%- if item.key == _cur -%}
      <a href="{{ item.url }}" data-nav="{{ item.key }}" aria-current="page"
         class="nav__link rounded-lg px-3 py-2 font-mono text-[13px] text-blue-600 bg-blue-50">{{ item.label }}</a>
      {%- else -%}
      <a href="{{ item.url }}" data-nav="{{ item.key }}"
         class="nav__link rounded-lg px-3 py-2 font-mono text-[13px] text-slate-500 transition hover:bg-slate-100 hover:text-slate-900">{{ item.label }}</a>
      {%- endif -%}
      {%- endfor -%}

      <button id="langSwitch" type="button" aria-label="Sprache wechseln / Switch language" title="DE / EN"
              class="ml-0 mt-2 inline-flex items-center gap-1 self-start rounded-full border border-slate-300 bg-slate-100 p-[3px]
                     font-mono text-[11px] font-bold md:ml-3 md:mt-0 md:self-auto">
        <span data-lang-opt="de" class="rounded-full px-2 py-0.5 text-slate-500 transition">DE</span>
        <span class="px-0 text-slate-300" aria-hidden="true">|</span>
        <span data-lang-opt="en" class="rounded-full px-2 py-0.5 text-slate-500 transition">EN</span>
      </button>
    </div>
  </div>
</nav>
