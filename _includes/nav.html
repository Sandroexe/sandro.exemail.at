{%- comment -%} Zentrale Navigation · Quelle: _data/navigation.yml {%- endcomment -%}
{%- assign _cur = page.nav -%}
<nav class="nav" id="nav" aria-label="Hauptnavigation">
  <div class="nav__inner">
    <a href="/index.html" class="nav__logo">sandro<span>.exe</span></a>

    <button class="nav__toggle" id="navToggle" aria-expanded="false" aria-controls="navMenu" aria-label="Menü umschalten">
      <span></span><span></span><span></span>
    </button>

    <div class="nav__menu" id="navMenu">
      {%- for item in site.data.navigation.primary -%}
      <a href="{{ item.url }}" class="nav__link{% if item.key == _cur %} is-active{% endif %}"
         data-nav="{{ item.key }}"{% if item.key == _cur %} aria-current="page"{% endif %}>{{ item.label }}</a>
      {%- endfor -%}

      <button class="lang-switch" id="langSwitch" type="button" aria-label="Sprache wechseln">
        <span data-lang-opt="de">DE</span><span data-lang-opt="en">EN</span>
      </button>
    </div>
  </div>
</nav>
