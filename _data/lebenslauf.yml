# ═════════════════════════════════ SKILLS ══════════════════════════════════
# In Gruppen sortiert. "icon" = Icon-Name aus assets/icons/.

skills:
  titel: "Kenntnisse"
  gruppen:

    - gruppe: "Netzwerk"
      icon: "network"
      eintraege:
        - "Cisco IOS (CCNA)"
        - "Routing & Switching"
        - "VLANs, Subnetting"
        - "WLAN & Firewall-Grundlagen"

    - gruppe: "Programmierung & Web"
      icon: "code"
      eintraege:
        - "HTML, CSS, JavaScript"
        - "Python"
        - "C"
        - "Git & GitHub"

    - gruppe: "Hardware & Elektronik"
      icon: "cpu"
      eintraege:
        - "Schaltungsentwicklung"
        - "Mikrocontroller"
        - "Messtechnik"
        - "PC- & Server-Hardware"

    - gruppe: "IT-Betrieb"
      icon: "wrench"
      eintraege:
        - "Windows & Microsoft 365"
        - "Benutzer-Support"
        - "Backup & Datensicherheit"

