# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  ✏️  lebenslauf.yml – DEIN LEBENSLAUF                                     ║
# ╠══════════════════════════════════════════════════════════════════════════╣
# ║  Was ist diese Datei?                                                    ║
# ║    Alle Inhalte der Seite "Lebenslauf" UND der Druck-/PDF-Version:       ║
# ║    Berufserfahrung, Praktika, Ausbildung, Engagement, Skills, Sprachen.  ║
# ║    Die Felder heißen so ähnlich wie bei LinkedIn, damit du deine Daten   ║
# ║    einfach übertragen kannst (siehe Tabelle unten).                      ║
# ║                                                                          ║
# ║  Was darf ich ändern?                                                    ║
# ║    Alle Werte. Einträge hinzufügen, löschen, umsortieren.                ║
# ║    Innerhalb eines Abschnitts: NEUESTER Eintrag zuerst.                  ║
# ║    Ein Abschnitt ohne Einträge wird automatisch ausgeblendet.            ║
# ║                                                                          ║
# ║  Was sollte ich NICHT ändern?                                            ║
# ║    Die Feldnamen (links vom Doppelpunkt) und die Einrückung.             ║
# ║                                                                          ║
# ║  DATUMSFORMAT:  "JJJJ-MM"  (z. B. "2024-09")  oder nur  "JJJJ"           ║
# ║                 Immer in Anführungszeichen!                              ║
# ║                 bis: ""  →  wird als "heute" angezeigt                   ║
# ║                                                                          ║
# ║  Beispiel:                                                               ║
# ║    von: "2024-09"                                                        ║
# ║    bis: ""            ← aktueller Job                                    ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#
#  LINKEDIN → DIESE DATEI
#  ─────────────────────────────────────────────────────────────────────────
#  LinkedIn "Title"            → position        LinkedIn "School Name" → schule
#  LinkedIn "Company Name"     → unternehmen     LinkedIn "Degree Name" → abschluss
#  LinkedIn "Location"         → ort             LinkedIn "Field of study" → fachrichtung
#  LinkedIn "Employment type"  → art             LinkedIn "Activities"  → aktivitaeten
#  LinkedIn "Started On"       → von             LinkedIn "Role" (Ehrenamt) → rolle
#  LinkedIn "Finished On"      → bis             LinkedIn "Organization" → organisation
#  LinkedIn "Description"      → beschreibung    LinkedIn "Cause"       → bereich
#
#  Automatisch übertragen? → tools/linkedin-import.py (Anleitung in tools/LIESMICH.md)


# ═══════════════════════════ PDF-DOWNLOAD ══════════════════════════════════
# Möchtest du ein eigenes, fertig gestaltetes PDF anbieten?
#   → PDF nach  assets/lebenslauf/  legen und den Dateinamen hier eintragen.
# Leer lassen ("") → Der Button öffnet stattdessen den Druckdialog mit einem
#   automatisch erzeugten, sauberen A4-Layout ("Als PDF speichern").

pdf_datei: ""                        # z. B. "Lebenslauf-Sandro-Exenberger.pdf"
download_text: "Lebenslauf herunterladen"


# ═══════════════════════════ EINLEITUNG ════════════════════════════════════

titel: "Lebenslauf"
einleitung: >-
  Mein bisheriger Weg – von der HTL über die ersten Jobs in der IT bis zum
  Engagement als Schulsprecher.


# ═══════════════════════════ BERUFSERFAHRUNG ═══════════════════════════════

berufserfahrung:
  titel: "Berufserfahrung"
  icon: "briefcase"
  eintraege:

    - position: "IT-Verantwortlicher (Teilzeit)"   # Jobtitel
      unternehmen: "Eder Elektrotechnik GmbH"      # Firma
      unternehmen_link: ""                         # Optional: Website der Firma
      ort: "Kirchbichl, Tirol"                     # Arbeitsort
      art: "Teilzeit"                              # Vollzeit / Teilzeit / Freiberuflich …
      von: "[BITTE AUSFÜLLEN]"                     # Beginn, z. B. "2024-09"
      bis: ""                                      # Ende – leer = "heute"
      beschreibung: >-
        Verantwortlich für die gesamte IT-Infrastruktur des Unternehmens.
      aufgaben:                                    # Optional: Stichpunkte
        - "Betreuung von Netzwerk, Servern und Arbeitsplätzen"
        - "Anwender-Support und Einrichtung neuer Geräte"
        - "Planung und Umsetzung von IT-Verbesserungen"
      anzeigen: true                               # false = ausblenden

