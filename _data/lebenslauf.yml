# ═══════════════════════════════ ENGAGEMENT ════════════════════════════════
# Ehrenamt, Schulvertretung, Vereine (LinkedIn: "Volunteer experience")

engagement:
  titel: "Engagement"
  icon: "users"
  eintraege:

    - rolle: "Schulsprecher"                       # Deine Funktion
      organisation: "HTBLVA Innsbruck Anichstraße" # Organisation / Verein
      organisation_link: ""
      bereich: "Bildung"                           # LinkedIn "Cause" (optional)
      von: "[BITTE AUSFÜLLEN]"
      bis: ""
      beschreibung: >-
        Gewählte Vertretung für rund 1.600 Schülerinnen und Schüler – Ansprechpartner
        für Anliegen, Bindeglied zu Direktion und Lehrkörper und Organisation von
        Schulveranstaltungen.
      anzeigen: true

