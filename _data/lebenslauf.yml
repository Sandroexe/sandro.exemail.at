# ═══════════════════════════════ PRAKTIKA ══════════════════════════════════

praktika:
  titel: "Praktika"
  icon: "wrench"
  eintraege:

    - position: "Praktikant"                       # [BITTE AUSFÜLLEN: genaue Bezeichnung prüfen]
      unternehmen: "Stadtwerke Wörgl – WörglWeb"
      unternehmen_link: ""
      ort: "Wörgl, Tirol"
      art: "Pflichtpraktikum"
      von: "[BITTE AUSFÜLLEN]"
      bis: "[BITTE AUSFÜLLEN]"
      beschreibung: >-
        [BITTE AUSFÜLLEN: 1–2 Sätze zu deinen Aufgaben bei WörglWeb.]
      aufgaben: []
      anzeigen: true

# ─── Vorlage: wie bei Berufserfahrung ─────────────────────────────────────


# ═══════════════════════════════ AUSBILDUNG ════════════════════════════════

ausbildung:
  titel: "Ausbildung"
  icon: "graduation-cap"
  eintraege:

    - schule: "HTBLVA Innsbruck Anichstraße"       # Name der Schule
      schule_link: ""                              # Optional: Website der Schule
      abschluss: "Reife- und Diplomprüfung (Matura)"   # Abschluss
      fachrichtung: "Elektronik & Technische Informatik"  # Fachrichtung
      ort: "Innsbruck, Tirol"
      von: "2022-09"
      bis: "2027-06"
      voraussichtlich: true                        # true = "voraussichtlich" vor dem Enddatum
      beschreibung: >-
        Aktuell in der Abschlussklasse 5bHEL.
      aktivitaeten: "Schulsprecher"                # Optional: Aktivitäten & Vereine
      anzeigen: true

