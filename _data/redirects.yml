# ═══════════════════════════════════════════════════════════════════
#  redirects.yml — alte URLs am Leben halten
#
#  Aus jedem Eintrag erzeugt redirects.html eine Weiterleitungsseite
#  mit Meta-Refresh, <link rel="canonical"> und JS-Fallback. Ohne
#  JavaScript funktioniert sie ebenso.
#
#  ⚠ /contact/ steht auf der gedruckten Visitenkarte und ist deshalb
#    eine echte Seite, kein Redirect. Nie ändern.
# ═══════════════════════════════════════════════════════════════════

- from: /projects.html
  to: /projects/
- from: /certificates.html
  to: /certificates/
- from: /lab.html
  to: /lab/
- from: /links.html
  to: /links/
- from: /impressum.html
  to: /impressum/
- from: /datenschutz.html
  to: /datenschutz/
- from: /contact.html
  to: /contact/
- from: /cv.html
  to: /cv/
# Naheliegende Tippfehler und englische Varianten mit abfangen
- from: /kontakt/
  to: /contact/
- from: /imprint/
  to: /impressum/
- from: /privacy/
  to: /datenschutz/
- from: /lebenslauf/
  to: /cv/
- from: /zertifikate/
  to: /certificates/
- from: /projekte/
  to: /projects/
