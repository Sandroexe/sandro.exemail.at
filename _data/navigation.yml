# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  ✏️  navigation.yml – HAUPTMENÜ                                           ║
# ╠══════════════════════════════════════════════════════════════════════════╣
# ║  Was ist diese Datei?                                                    ║
# ║    Die Menüpunkte oben im Header (am Handy im Burger-Menü).              ║
# ║    Die Reihenfolge hier = Reihenfolge im Menü.                           ║
# ║                                                                          ║
# ║  Was darf ich ändern?                                                    ║
# ║    • titel     → Beschriftung umbenennen                                 ║
# ║    • anzeigen  → true = sichtbar, false = ausgeblendet                   ║
# ║    • Einträge verschieben, hinzufügen, löschen                           ║
# ║                                                                          ║
# ║  Was sollte ich NICHT ändern?                                            ║
# ║    Die "url" nur ändern, wenn du auch den "permalink" der Seite änderst. ║
# ║    URLs beginnen und enden immer mit "/".                                ║
# ║                                                                          ║
# ║  Rechtliche Seiten (Impressum, Datenschutz) stehen im Footer             ║
# ║  → siehe footer.yml                                                      ║
# ║                                                                          ║
# ║  Beispiel – neue Seite "Projekte":                                       ║
# ║    1. Datei  projekte.md  im Hauptordner anlegen (siehe README)          ║
# ║    2. Hier eintragen:                                                    ║
# ║         - titel: "Projekte"                                              ║
# ║           url: "/projekte/"                                              ║
# ║           anzeigen: true                                                 ║
# ╚══════════════════════════════════════════════════════════════════════════╝


# ═══════════════════════════════ HAUPTMENÜ ═════════════════════════════════

hauptmenue:

  - titel: "Start"            # Beschriftung im Menü
    url: "/"                  # Adresse der Seite
    anzeigen: true            # true = sichtbar, false = ausgeblendet

  - titel: "Lebenslauf"
    url: "/lebenslauf/"
    anzeigen: true

  - titel: "News"
    url: "/news/"
    anzeigen: true

  - titel: "Zertifikate"
    url: "/zertifikate/"
    anzeigen: true

  - titel: "Galerie"
    url: "/galerie/"
    anzeigen: true

  - titel: "Kontakt"
    url: "/kontakt/"
    anzeigen: true

