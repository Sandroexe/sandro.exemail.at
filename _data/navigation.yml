  - { key: "nav.cv", url: "/cv/" }
  - { key: "nav.certificates", url: "/certificates/" }
  - { key: "nav.lab", url: "/lab/" }
  - { key: "nav.links", url: "/links/" }
  - { key: "nav.contact", url: "/contact/" }

legal:
  - { key: "nav.imprint", url: "/impressum/" }
  - { key: "nav.social_imprint", url: "/impressum/social/" }
