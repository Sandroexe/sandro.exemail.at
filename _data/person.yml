# ═════════════════════════ HIGHLIGHTS (STARTSEITE) ═════════════════════════
# Kleine Karten unter dem Hero-Bereich. 3 oder 6 Karten sehen am besten aus.

highlights_titel: "Auf einen Blick"

highlights:
  - icon: "graduation-cap"
    titel: "HTL Anichstraße"
    text: "Elektronik & Technische Informatik, Abschlussklasse 5bHEL – Matura voraussichtlich Juni 2027."
    link: "/lebenslauf/"

  - icon: "cpu"
    titel: "HTL-Incubator"
    text: "Kernteam des Open Maker Space – 3D-Druck, Lasercutter, Löt- und Messtechnik."
    link: "/lebenslauf/"

  - icon: "network"
    titel: "Netzwerktechnik"
    text: "Cisco Networking Academy: Switching, Routing & Wireless Essentials."
    link: "/zertifikate/"

  - icon: "users"
    titel: "Schülervertretung"
    text: "Stellvertretender Schulsprecher für rund 1.600 Schülerinnen und Schüler, Landesleitung der Schülerunion Tirol."
    link: "/lebenslauf/"

