# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  ✏️  person.yml – ÜBER MICH                                               ║
# ╠══════════════════════════════════════════════════════════════════════════╣
# ║  Was ist diese Datei?                                                    ║
# ║    Deine Basisdaten: Name, Titel, Vorstellungstext, Profilfoto, Wohnort, ║
# ║    die Highlight-Karten und die (optionale) Fotogalerie der Startseite.  ║
# ║    Diese Daten werden auf der GANZEN Website verwendet (Startseite,      ║
# ║    Header, Footer, Lebenslauf-Druckversion, Google-Daten).               ║
# ║                                                                          ║
# ║  Was darf ich ändern?                                                    ║
# ║    Alle Texte rechts vom Doppelpunkt.                                    ║
# ║                                                                          ║
# ║  Was sollte ich NICHT ändern?                                            ║
# ║    Die Namen links vom Doppelpunkt (z. B. "kurztitel:") und die          ║
# ║    Einrückung (immer 2 Leerzeichen, KEINE Tabulatoren).                  ║
# ║                                                                          ║
# ║  Regeln für YAML (dieses Dateiformat):                                   ║
# ║    • Texte mit Doppelpunkt, # oder Anführungszeichen in "..." setzen.    ║
# ║    • Ein leeres Feld ("") wird auf der Website einfach ausgeblendet.     ║
# ║    • Zeilen mit # am Anfang sind Kommentare und werden ignoriert.        ║
# ║                                                                          ║
# ║  Beispiel:                                                               ║
# ║    kurztitel: "Elektronik & IT | Netzwerke | Webentwicklung"             ║
# ╚══════════════════════════════════════════════════════════════════════════╝


# ═══════════════════════════════ NAME & TITEL ══════════════════════════════

vorname: "Sandro"
nachname: "Exenberger"

# Kurzer Untertitel unter deinem Namen (Startseite & Lebenslauf)
kurztitel: "Elektronik & IT | Netzwerke | Webentwicklung"

# Berufsbezeichnung für Google (schema.org "jobTitle")
berufsbezeichnung: "Schüler für Elektronik und Technische Informatik"

# Kleine Begrüßungszeile über dem Namen (leer lassen = ausblenden)
begruessung: "Hallo, ich bin"

# 1–2 Sätze Vorstellung für die Startseite
vorstellung: >-
  Ich lerne Elektronik und Technische Informatik an der HTL Anichstraße in Innsbruck
  und setze mich als Schülervertreter und in der Schülerunion Tirol für die Anliegen
  von Schülerinnen und Schülern ein. In meiner Freizeit baue ich Netzwerke, Server
  und Projekte an der Schnittstelle von Hardware, Software und Mechanik – vom
  Homelab bis zum Smart Home.


# ═══════════════════════════════ WOHNORT ═══════════════════════════════════

standort:
  ort: "Schwoich"                 # Gemeinde
  region: "bei Kufstein, Tirol"   # Zusatz direkt nach dem Ort (leer lassen = ausblenden)
  land: "Österreich"


# ═══════════════════════════════ PROFILFOTO ════════════════════════════════
# So tauschst du das Foto:
#   1. Foto quadratisch zuschneiden (mindestens 1000 × 1000 Pixel – Google
#      verwendet es als Hauptbild/Vorschaubild der Website).
#   2. Als JPG nach  assets/img/  kopieren, z. B. "profil.jpg".
#   3. Optional zusätzlich als WebP speichern ("profil.webp") – lädt schneller.
#      (Kostenlos z. B. mit https://squoosh.app – läuft komplett im Browser.)
#   4. Unten die Dateinamen eintragen.

foto:
  datei: "profil.jpg"               # Dateiname in assets/img/ (JPG, PNG oder SVG)
  webp: "profil.webp"               # Optional: WebP-Version, z. B. "profil.webp"
  alt: "Porträtfoto von Sandro Exenberger am Rednerpult"   # Beschreibung für Screenreader und Google
  breite: 1000                      # Bildbreite in Pixel (mind. 1000 – Google nutzt das Foto als Hauptbild)
  hoehe: 1000                       # Bildhöhe in Pixel
  # Kleinere Version fürs Handy (optional, lädt schneller). Gleiches Motiv!
  klein: "profil-600.jpg"
  klein_webp: "profil-600.webp"
  klein_breite: 600


# ════════════════════════════ BUTTONS (STARTSEITE) ═════════════════════════
# stil: "primaer" (gefüllt) oder "sekundaer" (nur Rahmen)

buttons:
  - text: "Lebenslauf ansehen"
    link: "/lebenslauf/"
    icon: "file-text"
    stil: "primaer"
  - text: "Kontakt aufnehmen"
    link: "/kontakt/"
    icon: "send"
    stil: "sekundaer"

