anzeigen: true
titel: Projekte
einleitung: Was ich in meiner Freizeit baue und betreibe – vom eigenen
  Mailserver über das Heimnetz bis zum Smart Home.
startseite:
  anzeigen: true
  titel: Woran ich baue
  anzahl: 3
projekte:
  - titel: Eigene Domain & Mailserver
    untertitel: "@exemail.at"
    icon: mail
    beschreibung: Aufbau und Betrieb einer eigenen Mail-Domain inklusive
      DNS-Verwaltung sowie SPF-, DKIM- und DMARC-Einrichtung für zuverlässige
      Zustellung.
    tags:
      - DNS
      - E-Mail
      - SPF/DKIM/DMARC
      - Self-Hosted
    hervorgehoben: true
    anzeigen: true
  - titel: AdGuard Home DNS
    untertitel: Netzwerkweiter Filter
    icon: shield-check
    beschreibung: Privater DNS-Server für netzwerkweites Blockieren von Werbung und
      Trackern. Erhöht die Privatsphäre aller Geräte im Haushalt, ohne dass auf
      jedem einzelnen etwas installiert werden muss.
    tags:
      - DNS
      - AdGuard
      - Security
      - Privacy
    hervorgehoben: true
    anzeigen: true
  - titel: Home Assistant Energie-Dashboard
    untertitel: Verbrauch sichtbar machen
    icon: zap
    beschreibung: Zentrales Smart-Home-Dashboard zur Überwachung und Optimierung des
      Energieverbrauchs. Sensordaten laufen zusammen, Verbräuche werden über die
      Zeit ausgewertet.
    tags:
      - Home Assistant
      - Smart Home
      - IoT
      - Automation
    hervorgehoben: true
    anzeigen: true
  - titel: Eigener DynDNS-Dienst
    untertitel: In einem LXC-Container
    icon: refresh-cw
    beschreibung: Selbst gebauter Dynamic-DNS-Dienst, isoliert in einem
      LXC-Container auf Proxmox. Hält den Fernzugriff auf das Heimnetz trotz
      wechselnder IP-Adresse dauerhaft erreichbar – ohne Abhängigkeit von einem
      kommerziellen Anbieter.
    tags:
      - LXC
      - Proxmox
      - Networking
      - Bash
    hervorgehoben: false
    anzeigen: true
  - titel: Mediathek mit Jellyfin & Plex
    untertitel: Eigenes Streaming
    icon: play
    beschreibung: Selbst betriebene Medienserver-Lösung mit Jellyfin und Plex für
      Verwaltung und Streaming der eigenen Sammlung – inklusive Transcoding und
      Zugriff von unterwegs.
    tags:
      - Jellyfin
      - Plex
      - Self-Hosted
      - Docker
    hervorgehoben: false
    anzeigen: true
  - titel: sandro.exemail.at
    untertitel: Diese Website
    icon: globe
    beschreibung: Datengetriebenes Portfolio auf Jekyll, automatisch gebaut und
      veröffentlicht über GitHub Actions. Jede Information steht genau einmal in
      einer YAML-Datei. Ohne externe Dienste, ohne Tracking, mit Hell- und
      Dunkelmodus.
    tags:
      - Jekyll
      - HTML
      - SCSS
      - JavaScript
      - GitHub Actions
    link: https://github.com/Sandroexe/sandro.exemail.at
    link_text: Quellcode auf GitHub
    hervorgehoben: false
    anzeigen: true
  - titel: Test
    untertitel: Test
    icon: download
    beschreibung: Test
    hervorgehoben: false
    anzeigen: true
  - titel: test
