lab.head: "Workstation, Betriebssystem und Toolchain – womit ich täglich arbeite und lerne."
lab.desc: "Der Arbeitsplatz von Sandro Exenberger – Ryzen 7 9800X3D, RTX 5070, CachyOS. Hardware- und Software-Setup im Detail."
