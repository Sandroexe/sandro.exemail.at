home.about_title: "Über mich"
home.about_p1: "Als Regionalvorstand für das Tiroler Unterland bei der Schülerunion Österreich setze ich mich aktiv für die Anliegen von Schüler:innen ein und bringe meine Kompetenzen in Kommunikation und Konfliktlösung ein. Parallel dazu vertrete ich als Schülervertreter an der HTBLVA Anichstraße die Interessen von etwa 1600 Schüler:innen im Schulgemeinschaftsausschuss."
home.about_p2: "Neben meiner organisatorischen Tätigkeit leite ich den „HTL-Incubator“, einen Open Maker Space, in dem ich Mitschüler bei der Nutzung moderner Technologien unterstütze. Mein technisches Wissen vertiefe ich durch meine Ausbildung in Elektronik und Technischer Informatik sowie durch meine CCNA-Zertifizierung."
