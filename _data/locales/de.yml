# ── Datenschutz ─────────────────────────────────────────────────────────
ds.title: "Datenschutzerklärung"
ds.desc: "Datenschutzerklärung gemäß DSGVO für sandro.exemail.at."
ds.h1: "1. Grundlegendes"
ds.p1: "Der Schutz Ihrer persönlichen Daten ist mir ein besonderes Anliegen. Ich verarbeite Ihre Daten ausschließlich auf Grundlage der gesetzlichen Bestimmungen (DSGVO, TKG 2003)."
ds.h2: "2. Hosting durch GitHub Pages"
ds.p2: "Diese Website wird bei GitHub Pages gehostet (GitHub Inc., San Francisco, USA). Beim Besuch erfasst GitHub IP-Adressen zu Sicherheitszwecken."
ds.h3: "3. Kontaktaufnahme"
ds.p3: "Wenn Sie das Kontaktformular oder E-Mail nutzen, werden Ihre Angaben (Name, E-Mail-Adresse, ggf. Telefonnummer, Nachricht) zwecks Bearbeitung der Anfrage verarbeitet. Das Formular übermittelt die Daten an api.exemail.at. Die Daten werden nicht ohne Ihre Einwilligung weitergegeben."
ds.h4: "4. Externe Dienste"
ds.p4: "Es können Inhalte externer Dienste eingebunden sein: Google Fonts (Schriftauslieferung) sowie eine GitHub-Contributions-API zur Anzeige der Commit-Aktivität. Dabei kann Ihre IP-Adresse an die jeweiligen Anbieter übermittelt werden."
ds.h5: "5. Cookies"
ds.p5: "Diese Website verwendet keine zustimmungspflichtigen Tracking- oder Werbe-Cookies. Lediglich die gewählte Sprache wird lokal im Browser (localStorage) gespeichert."
ds.h6: "6. Ihre Rechte"
ds.p6: "Sie haben das Recht auf Auskunft, Berichtigung, Löschung, Einschränkung, Datenübertragbarkeit, Widerruf und Widerspruch. Bei Verstößen können Sie sich an die österreichische Datenschutzbehörde wenden."
ds.responsible: "Verantwortlich:"
