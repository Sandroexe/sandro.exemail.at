# ── Privacy policy (Datenschutz) ───────────────────────────────────────
ds.title: "Privacy Policy"
ds.desc: "GDPR privacy policy for sandro.exemail.at."
ds.h1: "1. Basics"
ds.p1: "The protection of your personal data is particularly important to me. I process your data exclusively on the basis of the statutory provisions (GDPR, Austrian TKG 2003)."
ds.h2: "2. Hosting via GitHub Pages"
ds.p2: "This website is hosted by GitHub Pages (GitHub Inc., San Francisco, USA). When you visit, GitHub records IP addresses for security purposes."
ds.h3: "3. Getting in touch"
ds.p3: "If you use the contact form or email, your details (name, email address, phone number if provided, message) are processed to handle your request. The form submits the data to api.exemail.at. The data is not shared without your consent."
ds.h4: "4. External services"
ds.p4: "Content from external services may be embedded: Google Fonts (font delivery) and a GitHub contributions API to display commit activity. Your IP address may be transmitted to the respective providers."
ds.h5: "5. Cookies"
ds.p5: "This website uses no consent-requiring tracking or advertising cookies. Only the selected language is stored locally in the browser (localStorage)."
ds.h6: "6. Your rights"
ds.p6: "You have the right to information, correction, deletion, restriction, data portability, revocation and objection. In case of violations you can contact the Austrian Data Protection Authority."
