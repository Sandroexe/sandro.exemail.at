# ═══════════════════════════════════════════════════════════════════
#  social.yml — DIE EINZIGE QUELLE für alle Social-Media-Kanäle
#
#  Speist automatisch:
#    · Footer-Icons            · /links/
#    · /impressum/social/      · JSON-LD sameAs
#    · /contact/               · vcard.vcf
#
#  Neuen Kanal aufnehmen = einen Eintrag unter `channels` ergänzen.
#  Keine HTML-Datei muss dafür angefasst werden.
# ═══════════════════════════════════════════════════════════════════

# ── Kontexte ──────────────────────────────────────────────────────
#  Die medienrechtliche Verantwortlichkeit steht EINMAL hier, nicht
#  bei jedem Kanal. Jeder Kanal verweist per `context:` hierher.
#  /impressum/social/ rendert pro Kontext einen eigenen Abschnitt.
contexts:
  - id: private
    order: 1
    name: "Private Kanäle"
    name_en: "Personal channels"
    responsible: "Sandro Exenberger"
    subject: >-
      Persönliches Portfolio: Darstellung eigener Projekte, Ausbildung
      und Interessen aus den Bereichen Elektronik, Netzwerktechnik,
      Linux und Maker-Kultur.
    subject_en: >-
      Personal portfolio: presentation of my own projects, education and
      interests in electronics, network engineering, Linux and maker culture.
    # Blattlinie nach § 25 Mediengesetz
    blattlinie: >-
      Persönliche Website und private Social-Media-Kanäle zur Darstellung
      eigener Projekte, der Ausbildung sowie fachlicher Interessen aus den
      Bereichen Elektronik, Netzwerktechnik und Linux. Die Inhalte geben
      ausschließlich die persönliche Auffassung des Medieninhabers wieder.
    blattlinie_en: >-
      Personal website and private social media channels presenting my own
      projects, education and technical interests in electronics, network
      engineering and Linux. All content reflects the personal views of the
      media owner only.

  - id: politik
    order: 2
    name: "Schulpolitisches Engagement"
    name_en: "Student politics"
    # TODO 4a: Wer ist für diesen Kanal medienrechtlich verantwortlich?
    #   Du selbst als Privatperson, oder die Schülerunion als Organisation?
    #   Das entscheidet, wer hier steht — und wer haftet.
    responsible: "Sandro Exenberger"
    subject: >-
      Information über die Tätigkeit als Regionalvorstand Tiroler Unterland
      der Schülerunion Österreich sowie als gewählte Schülervertretung.
    subject_en: >-
      Information about my work as regional board member for Tiroler Unterland
      of Schülerunion Österreich and as an elected student representative.
    blattlinie: >-
      Information über die schulpolitische Tätigkeit des Medieninhabers,
      über bildungspolitische Themen sowie über die Anliegen von
      Schülerinnen und Schülern. Die Inhalte geben die persönliche
      politische Auffassung des Medieninhabers wieder.
    blattlinie_en: >-
      Information about the media owner's activities in student politics,
      about education policy topics and about the concerns of students.
      All content reflects the personal political views of the media owner.
    # TODO 4b: Blattlinie oben ist ein fachlich üblicher Entwurf.
    #   Bitte prüfen und ggf. an die tatsächliche Ausrichtung anpassen.

