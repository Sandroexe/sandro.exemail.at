# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  ✏️  social.yml – KONTAKT & SOCIAL MEDIA                                  ║
# ╠══════════════════════════════════════════════════════════════════════════╣
# ║  Was ist diese Datei?                                                    ║
# ║    Alle Kontaktwege und Social-Media-Profile an EINER Stelle.            ║
# ║    Daraus entstehen automatisch:                                         ║
# ║      • die Icons im Header, Footer und auf der Startseite                ║
# ║      • die Karten auf der Kontaktseite                                   ║
# ║      • das Social-Media-Impressum: pro Kanal ein eigener Bereich mit     ║
# ║        Offenlegung + Datenschutzhinweisen, eine eigene Unterseite        ║
# ║        (z. B. /social-impressum/instagram/) und ein Sprung-Button        ║
# ║                                                                          ║
# ║  Was darf ich ändern?                                                    ║
# ║    Alle Werte. Einträge hinzufügen, löschen oder mit "anzeigen: false"   ║
# ║    ausblenden. Die Reihenfolge hier = Reihenfolge auf der Website.       ║
# ║                                                                          ║
# ║  Was sollte ich NICHT ändern?                                            ║
# ║    Die Feldnamen (links vom Doppelpunkt) und bei "typ" nur die drei      ║
# ║    erlaubten Werte verwenden: link, email, telefon.                      ║
# ║    Die "id" eines Kanals NICHT mehr ändern, sobald der Impressum-Link    ║
# ║    in einer Bio steht – sonst funktioniert der Link dort nicht mehr.     ║
# ║                                                                          ║
# ║  Spam-Schutz:                                                            ║
# ║    E-Mail und Telefonnummer werden automatisch verschlüsselt in die      ║
# ║    Seite geschrieben und erst im Browser lesbar gemacht. Du trägst sie   ║
# ║    hier ganz normal ein.                                                 ║
# ║                                                                          ║
# ║  Neuer Kanal (später)?                                                   ║
# ║    → Vorlage ganz unten kopieren. Ein Block = alles (Buttons, Kontakt-   ║
# ║      karte, Impressum, Datenschutz, Unterseite, Sprung-Button).          ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#
#  ERKLÄRUNG DER FELDER
#  ─────────────────────────────────────────────────────────────────────────
#  id            Kurzer, eindeutiger Name in Kleinbuchstaben ohne Leerzeichen,
#                z. B. "instagram". Daraus entstehen die Impressum-Links:
#                  sandro.exemail.at/social-impressum/instagram/   (Unterseite)
#                  sandro.exemail.at/social-impressum/#instagram   (Sprungmarke)
#  name          Anzeigename, z. B. "LinkedIn"
#  typ           "link"    → normale Web-Adresse (https://…)
#                "email"   → E-Mail-Adresse (wird zu einem mailto:-Link)
#                "telefon" → Telefonnummer (wird zu einem tel:-Link)
#  wert          Die Adresse, E-Mail oder Telefonnummer
#                Telefonnummer bitte im internationalen Format: "+43 664 1234567"
#  anzeigetext   Optional: was sichtbar steht, z. B. "@sandro.exenberger"
#                (leer = "wert" wird angezeigt). Beim Impressum = Kanalname/Handle.
#  beschreibung  Kurzer Satz für die Karte auf der Kontaktseite
#  icon          Dateiname des Icons in assets/icons/ (ohne ".svg")
#  anzeigen      true = Button/Karte sichtbar, false = überall ausgeblendet
#                (das Impressum steuert "rechtliches → impressum_anzeigen")
#  orte          Wo soll der Button erscheinen? Beliebig kombinierbar:
#                header, footer, startseite, kontakt
#
#  rechtliches   NUR für Social-Media-Kanäle. Steuert das Social-Media-Impressum.
#                Fehlt der Block → Kanal erscheint dort nicht (z. B. E-Mail).
#    impressum_anzeigen          true = eigener Bereich + Unterseite, false = weg
#    betreiber_name              Plattformbetreiber für Nutzer in der EU      (PFLICHT)
#    betreiber_anschrift         Anschrift des Betreibers                     (PFLICHT)
#    datenschutz_link_plattform  Datenschutzerklärung der Plattform           (PFLICHT)
#    einstellungen_link_plattform  Datenschutz-Einstellungen der Plattform    (freiwillig)
#    rechte_link_plattform       Wo man Betroffenenrechte direkt beim Betreiber
#                                geltend macht (leer = Datenschutzerklärung)  (freiwillig)
#    grundlegende_richtung       Blattlinie nur für diesen Kanal (leer = die
#                                allgemeine aus rechtliches.yml)              (freiwillig)
#    insights_genutzt            true = die Plattform zeigt dir Statistiken an
#                                (z. B. Profilaufrufe, Business-/Creator-Konto)
#    insights_bezeichnung        Wie heißen diese Statistiken? (wird angezeigt)
#    insights_hinweis            Besonderheiten der Statistik (Freitext)
#    gemeinsame_verantwortung    true = gemeinsame Verantwortlichkeit nach
#                                Art. 26 DSGVO (nur bei Unternehmens-/Fanseiten
#                                mit Seitenstatistik – NICHT bei persönlichen
#                                Profilen, siehe RECHTLICHES.md)
#    vereinbarung_link           Link zur Art.-26-Vereinbarung der Plattform
#    drittland_text              Datenübermittlung in die USA: wer + Grundlage
#    zusaetzliche_hinweise       Freitext, erscheint am Ende des Kanals       (freiwillig)


# ═════════════════════════════ KONTAKTSEITE ════════════════════════════════
# Überschrift und Einleitung der Seite /kontakt/

kontaktseite:
  titel: "Kontakt"
  einleitung: >-
    Sie möchten mich erreichen? Wählen Sie einfach den Weg, der Ihnen am
    liebsten ist – ich melde mich so schnell wie möglich.


# ═══════════════════════════════ KONTAKT ═══════════════════════════════════

kanaele:

  - id: "email"
    name: "E-Mail"
    typ: "email"
    wert: "sandro@exemail.at"
    anzeigetext: ""
    beschreibung: "Der schnellste Weg zu mir."
    icon: "mail"
    anzeigen: true
    orte: [header, footer, startseite, kontakt]

  - id: "telefon"
    name: "Telefon"
    typ: "telefon"
    wert: "+43 676 7406799"
    anzeigetext: ""
    beschreibung: "Werktags nach der Schule gut erreichbar."
    icon: "phone"
    anzeigen: true
    orte: [kontakt]


# ═════════════════════════════ SOCIAL MEDIA ════════════════════════════════

  # ─────────────────────────────── LINKEDIN ────────────────────────────────
  - id: "linkedin"
    name: "LinkedIn"
    typ: "link"
    wert: "https://www.linkedin.com/in/sandro-exenberger-1a5486315/"
    anzeigetext: "Sandro Exenberger"
    beschreibung: "Beruflicher Werdegang und Vernetzung."
    icon: "linkedin"
    anzeigen: true
    orte: [header, footer, startseite, kontakt]
    rechtliches:
      impressum_anzeigen: true
      betreiber_name: "LinkedIn Ireland Unlimited Company"
      betreiber_anschrift: "Wilton Plaza, Wilton Place, Dublin 2, Irland"
      datenschutz_link_plattform: "https://de.linkedin.com/legal/privacy-policy"
      einstellungen_link_plattform: "https://www.linkedin.com/mypreferences/d/categories/privacy"
      rechte_link_plattform: "https://www.linkedin.com/help/linkedin/ask/TSO-DPO"
      grundlegende_richtung: >-
        Berufliches Profil von Sandro Exenberger mit Informationen und Beiträgen
        zu Ausbildung, beruflichem Werdegang, Netzwerktechnik und IT.
      # LinkedIn zeigt jedem persönlichen Profil automatisch Statistiken an.
      insights_genutzt: true
      insights_bezeichnung: "Profil- und Beitragsstatistiken (z. B. Profilaufrufe, Impressionen, „Wer hat Ihr Profil angesehen“)"
      insights_hinweis: >-
        Je nach Ihren eigenen LinkedIn-Einstellungen kann mir LinkedIn anzeigen, dass
        Sie mein Profil angesehen haben. Das steuern Sie selbst unter
        „Einstellungen → Sichtbarkeit → Profilanzeigeoptionen“ (z. B. privater Modus).
      # Persönliches Profil, keine LinkedIn-Unternehmensseite → false.
      # Erst bei einer Unternehmensseite ("Page") auf true setzen und
      # vereinbarung_link = "https://legal.linkedin.com/pages-joint-controller-addendum"
      gemeinsame_verantwortung: false
      vereinbarung_link: ""
      drittland_text: >-
        LinkedIn übermittelt Daten auch an die LinkedIn Corporation in den USA. Die
        Übermittlung stützt sich auf das EU-US Data Privacy Framework
        (Angemessenheitsbeschluss, Art. 45 DSGVO) sowie auf
        Standardvertragsklauseln der EU-Kommission (Art. 46 DSGVO).
      zusaetzliche_hinweise: ""

  # ─────────────────────────────── INSTAGRAM ───────────────────────────────
  - id: "instagram"
    name: "Instagram"
    typ: "link"
    wert: "https://www.instagram.com/sandro_exenberger/"
    anzeigetext: "@sandro_exenberger"
    beschreibung: "Einblicke abseits vom Lebenslauf."
    icon: "instagram"
    anzeigen: true
    orte: [header, footer, startseite, kontakt]
    rechtliches:
      impressum_anzeigen: true
      betreiber_name: "Meta Platforms Ireland Limited"
      betreiber_anschrift: "Merrion Road, Dublin 4, D04 X2K5, Irland"
      datenschutz_link_plattform: "https://privacycenter.instagram.com/policy"
      einstellungen_link_plattform: "https://accountscenter.instagram.com/"
      rechte_link_plattform: "https://privacycenter.instagram.com/"
      grundlegende_richtung: >-
        Persönlicher Kanal von Sandro Exenberger mit Einblicken in Ausbildung,
        Technik, Projekte und Alltag.
      # Privates/persönliches Konto: keine Insights → false.
      # Bei Umstellung auf ein "professionelles Konto" (Creator/Business)
      # stellt Instagram Insights bereit → auf true setzen.
      insights_genutzt: false
      insights_bezeichnung: "Instagram Insights"
      insights_hinweis: ""
      gemeinsame_verantwortung: false
      vereinbarung_link: ""
      drittland_text: >-
        Meta übermittelt Daten auch an die Meta Platforms, Inc. in den USA. Die
        Übermittlung stützt sich auf das EU-US Data Privacy Framework
        (Angemessenheitsbeschluss, Art. 45 DSGVO) sowie auf
        Standardvertragsklauseln der EU-Kommission (Art. 46 DSGVO).
      zusaetzliche_hinweise: ""


