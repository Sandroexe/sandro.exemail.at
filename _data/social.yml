# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  ✏️  social.yml – KONTAKT & SOCIAL MEDIA                                  ║
# ╠══════════════════════════════════════════════════════════════════════════╣
# ║  Was ist diese Datei?                                                    ║
# ║    Alle Kontaktwege und Social-Media-Profile an EINER Stelle.            ║
# ║    Daraus entstehen automatisch: die Icons im Header, Footer und auf     ║
# ║    der Startseite, die Karten auf der Kontaktseite und die Kanal-Liste   ║
# ║    im Social-Media-Impressum.                                            ║
# ║                                                                          ║
# ║  Was darf ich ändern?                                                    ║
# ║    Alle Werte. Einträge hinzufügen, löschen oder mit "anzeigen: false"   ║
# ║    ausblenden. Die Reihenfolge hier = Reihenfolge auf der Website.       ║
# ║                                                                          ║
# ║  Was sollte ich NICHT ändern?                                            ║
# ║    Die Feldnamen (links vom Doppelpunkt) und bei "typ" nur die drei      ║
# ║    erlaubten Werte verwenden: link, email, telefon.                      ║
# ║                                                                          ║
# ║  Spam-Schutz:                                                            ║
# ║    E-Mail und Telefonnummer werden automatisch verschlüsselt in die      ║
# ║    Seite geschrieben und erst im Browser lesbar gemacht. Du trägst sie   ║
# ║    hier ganz normal ein.                                                 ║
# ║                                                                          ║
# ║  Beispiel – GitHub ergänzen:                                             ║
# ║    - name: "GitHub"                                                      ║
# ║      typ: "link"                                                         ║
# ║      wert: "https://github.com/Sandroexe"                                ║
# ║      icon: "github"                                                      ║
# ║      ...                                                                 ║
# ╚══════════════════════════════════════════════════════════════════════════╝
#
#  ERKLÄRUNG DER FELDER
#  ─────────────────────────────────────────────────────────────────────────
#  name          Anzeigename, z. B. "LinkedIn"
#  typ           "link"    → normale Web-Adresse (https://…)
#                "email"   → E-Mail-Adresse (wird zu einem mailto:-Link)
#                "telefon" → Telefonnummer (wird zu einem tel:-Link)
#  wert          Die Adresse, E-Mail oder Telefonnummer
#                Telefonnummer bitte im internationalen Format: "+43 664 1234567"
#  anzeigetext   Optional: was auf der Kontaktseite sichtbar steht,
#                z. B. "@sandro.exenberger" (leer = "wert" wird angezeigt)
#  beschreibung  Kurzer Satz für die Karte auf der Kontaktseite
#  icon          Dateiname des Icons in assets/icons/ (ohne ".svg")
#  anzeigen      true = sichtbar, false = überall ausgeblendet
#  orte          Wo soll der Button erscheinen? Beliebig kombinierbar:
#                header, footer, startseite, kontakt
#  impressum     true = Kanal wird im Social-Media-Impressum aufgelistet
#                (sinnvoll für alle Social-Media-Profile, nicht für E-Mail/Telefon)
#  grundlegende_richtung
#                Optional: Blattlinie NUR für diesen Kanal (leer = die
#                allgemeine aus rechtliches.yml gilt)
#  datenschutz_link
#                Optional: Datenschutzerklärung der Plattform (wird im
#                Social-Media-Impressum verlinkt)


# ═════════════════════════════ KONTAKTSEITE ════════════════════════════════
# Überschrift und Einleitung der Seite /kontakt/

kontaktseite:
  titel: "Kontakt"
  einleitung: >-
    Sie möchten mich erreichen? Wählen Sie einfach den Weg, der Ihnen am
    liebsten ist – ich melde mich so schnell wie möglich.


# ═══════════════════════════════ KONTAKT ═══════════════════════════════════

kanaele:

  - name: "E-Mail"
    typ: "email"
    wert: "[BITTE AUSFÜLLEN]"
    anzeigetext: ""
    beschreibung: "Der schnellste Weg zu mir."
    icon: "mail"
    anzeigen: true
    orte: [header, footer, startseite, kontakt]
    impressum: false
    grundlegende_richtung: ""
    datenschutz_link: ""

  - name: "Telefon"
    typ: "telefon"
    wert: "[BITTE AUSFÜLLEN]"
    anzeigetext: ""
    beschreibung: "Werktags nach der Schule gut erreichbar."
    icon: "phone"
    anzeigen: true
    orte: [kontakt]
    impressum: false
    grundlegende_richtung: ""
    datenschutz_link: ""


# ═════════════════════════════ SOCIAL MEDIA ════════════════════════════════

  - name: "LinkedIn"
    typ: "link"
    wert: "[BITTE AUSFÜLLEN]"          # z. B. "https://www.linkedin.com/in/dein-profil/"
    anzeigetext: "Sandro Exenberger"
    beschreibung: "Beruflicher Werdegang und Vernetzung."
    icon: "linkedin"
    anzeigen: true
    orte: [header, footer, startseite, kontakt]
    impressum: true
    grundlegende_richtung: ""
    datenschutz_link: "https://www.linkedin.com/legal/privacy-policy"

  - name: "Instagram"
    typ: "link"
    wert: "[BITTE AUSFÜLLEN]"          # z. B. "https://www.instagram.com/dein.name/"
    anzeigetext: "[BITTE AUSFÜLLEN]"   # z. B. "@dein.name"
    beschreibung: "Einblicke abseits vom Lebenslauf."
    icon: "instagram"
    anzeigen: true
    orte: [header, footer, startseite, kontakt]
    impressum: true
    grundlegende_richtung: ""
    datenschutz_link: "https://privacycenter.instagram.com/policy"


