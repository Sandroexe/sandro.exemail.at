email: "sandro@exemail.at"

phone:
  display: "+43 676 7406799" # so wird es angezeigt
  href: "+436767406799" # so steht es im tel:-Link

# ── Anschrift ─────────────────────────────────────────────────────
#  TODO 1: Straße und Hausnummer fehlen noch.
#  § 5 ECG verlangt die vollständige geografische Anschrift; PLZ und Ort
#  allein genügen nicht. Trag hier deine Zustelladresse ein — sobald
#  `street` nicht mehr mit "TODO" beginnt, erscheint sie überall
#  automatisch (Impressum, Social-Impressum, vCard, JSON-LD).
address:
  street: "TODO: Straße und Hausnummer"
  zip: "6334"
  city: "Schwoich"
  region: "Tirol"
  country: "Österreich"
  country_en: "Austria"
  country_code: "AT"

# ── Kontaktformular ───────────────────────────────────────────────
#  Selbst gehosteter Endpoint. Erwartet JSON:
#    { "name": …, "email": …, "phone": …, "message": … }
#
#  ⚠ Die API akzeptiert per CORS ausschließlich die Origin
#    https://sandro.exemail.at. In einer lokalen Vorschau
#    (localhost:4000) schlägt das Absenden deshalb zwangsläufig fehl —
#    das ist Absicht, kein Fehler. Testanleitung: docs/PFLEGE.md
form:
  endpoint: "https://api.exemail.at/api/contact"
  method: "POST"
  fields:
    - { id: name, type: text, required: true, autocomplete: name }
    - { id: email, type: email, required: true, autocomplete: email }
    - { id: phone, type: tel, required: false, autocomplete: tel }
    - { id: message, type: textarea, required: true, rows: 6 }

# ── vCard (/vcard.vcf) ────────────────────────────────────────────
#  Alle übrigen Felder kommen aus profile.yml und social.yml.
vcard:
  filename: "Sandro_Exenberger.vcf"
  organization: "HTBLVA Anichstraße"
  title: "Elektronik & Technische Informatik"
  title_en: "Electronics & Computer Engineering"
