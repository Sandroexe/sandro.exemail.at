# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  ✏️  zertifikate.yml – ZERTIFIKATE & NACHWEISE                            ║
# ╠══════════════════════════════════════════════════════════════════════════╣
# ║  Was ist diese Datei?                                                    ║
# ║    Alle Karten auf der Seite "Zertifikate" inklusive Filter und          ║
# ║    Detailansicht.                                                        ║
# ║                                                                          ║
# ║  Was darf ich ändern?                                                    ║
# ║    Alle Werte. Zertifikate hinzufügen, löschen, umsortieren              ║
# ║    (Reihenfolge hier = Reihenfolge auf der Website).                     ║
# ║                                                                          ║
# ║  Was sollte ich NICHT ändern?                                            ║
# ║    Die Feldnamen und die Einrückung.                                     ║
# ║                                                                          ║
# ║  Dateien (PDF, Bilder) legst du nach:  assets/zertifikate/               ║
# ║  und trägst hier nur den DATEINAMEN ein (z. B. "ccna.pdf").              ║
# ║                                                                          ║
# ║  ⚠️  Datenschutz-Tipp: Schwärze auf gescannten Zertifikaten persönliche   ║
# ║     Daten wie Geburtsdatum oder Adresse, bevor du sie hochlädst.         ║
# ║                                                                          ║
# ║  Beispiel:                                                               ║
# ║    - name: "Python Essentials 1"                                         ║
# ║      aussteller: "Cisco Networking Academy"                              ║
# ║      kategorie: "Netzwerk"                                               ║
# ╚══════════════════════════════════════════════════════════════════════════╝


# ═══════════════════════════════ SEITENTEXT ════════════════════════════════

titel: "Zertifikate"
einleitung: >-
  Nachweise über Weiterbildungen und Qualifikationen. Ein Klick auf eine Karte
  öffnet die Details.


# ═══════════════════════════════ KATEGORIEN ════════════════════════════════
# Reihenfolge der Filter-Buttons. Jedes Zertifikat braucht eine davon.
# Kategorien ohne Zertifikat werden automatisch ausgeblendet.

kategorien:
  - "Netzwerk & Security"
  - "Linux & Open Source"
  - "KI & Technologie"
  - "Soft Skills & Management"


