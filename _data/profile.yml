bio_short: >-
  Ich bin Sandro,
  lerne Elektronik und Technische Informatik an der HTBLVA Anichstraße
  und baue in meiner Freizeit Netzwerke, Server und alles, was blinkt.
bio_short_en: >-
  I'm Sandro. I study electronics and computer engineering at HTBLVA
  Anichstraße and spend my free time building networks, servers and
  anything with blinking lights.

bio_long:
  - >-
    Als Regionalvorstand für das Tiroler Unterland bei der Schülerunion
    Österreich setze ich mich aktiv für die Anliegen von Schüler:innen ein
    und bringe meine Kompetenzen in Kommunikation und Konfliktlösung ein.
    Parallel dazu vertrete ich als Schülervertreter an der HTBLVA
    Anichstraße die Interessen von etwa 1600 Schüler:innen im
    Schulgemeinschaftsausschuss.
  - >-
    Neben meiner organisatorischen Tätigkeit leite ich den HTL-Incubator,
    einen Open Maker Space, in dem ich Mitschüler:innen bei der Nutzung
    moderner Technologien unterstütze. Mein technisches Wissen vertiefe ich
    durch meine Ausbildung in Elektronik und Technischer Informatik sowie
    durch meine CCNA-Zertifizierung.

bio_long_en:
  - >-
    As regional board member for Tiroler Unterland at Schülerunion Österreich
    I actively represent students' interests and contribute my skills in
    communication and conflict resolution. In parallel I serve as an elected
    student representative at HTBLVA Anichstraße, representing roughly 1600
    students on the school community committee.
  - >-
    Alongside that organisational work I run the HTL-Incubator, an open maker
    space where I help fellow students work with modern technology. I deepen
    my technical knowledge through my training in electronics and computer
    engineering and through my CCNA certification.

